# Ative este arquivo somente quando for usar o login assistido da Área Central:
# docker compose -f docker-compose.yml -f docker-compose.area-central.yml up -d --build
#
# O gateway protege WebDriver e noVNC com uma chave interna e um token temporário
# por tentativa. A porta publicada é somente a do gateway; 4444 e 7900 nunca
# são expostas diretamente.
services:
  app:
    environment:
      REDEASSO_INTEGRATION_AREA_CENTRAL_ENABLED: "true"
      AREA_CENTRAL_BASE_URL: ${AREA_CENTRAL_BASE_URL:-https://redeasso.areacentral.com.br}
      AREA_CENTRAL_LOGIN_URL: ${AREA_CENTRAL_LOGIN_URL:-https://redeasso.areacentral.com.br/401/?pg=associado_catalogos_produtos&ordenacao=nome-asc}
      AREA_CENTRAL_WEBDRIVER_URL: http://area-central-browser:10000/webdriver
      AREA_CENTRAL_INTERACTIVE_URL: ${AREA_CENTRAL_INTERACTIVE_URL:-http://localhost:${AREA_CENTRAL_BROWSER_PORT:-7900}/vnc.html}
      AREA_CENTRAL_BROWSER_SERVICE_KEY: ${AREA_CENTRAL_BROWSER_SERVICE_KEY:?Defina uma chave interna forte em .env}
      AREA_CENTRAL_INTERACTIVE_TOKEN_SECRET: ${AREA_CENTRAL_INTERACTIVE_TOKEN_SECRET:?Defina um segredo HMAC forte em .env}
      AREA_CENTRAL_CONNECT_TIMEOUT: ${AREA_CENTRAL_CONNECT_TIMEOUT:-5s}
      AREA_CENTRAL_READ_TIMEOUT: ${AREA_CENTRAL_READ_TIMEOUT:-15s}
      AREA_CENTRAL_LOGIN_ATTEMPT_TIMEOUT: ${AREA_CENTRAL_LOGIN_ATTEMPT_TIMEOUT:-10m}

  area-central-browser:
    build:
      context: .
      dockerfile: infra/area-central-browser/Dockerfile
    image: redeasso-area-central-browser:local
    environment:
      BROWSER_SERVICE_KEY: ${AREA_CENTRAL_BROWSER_SERVICE_KEY:?Defina uma chave interna forte em .env}
      INTERACTIVE_TOKEN_SECRET: ${AREA_CENTRAL_INTERACTIVE_TOKEN_SECRET:?Defina um segredo HMAC forte em .env}
      ALLOWED_FRAME_ORIGIN: ${AREA_CENTRAL_ALLOWED_FRAME_ORIGIN:-http://localhost:${APP_PORT:-8080}}
    ports:
      - "${AREA_CENTRAL_BROWSER_BIND_ADDRESS:-127.0.0.1}:${AREA_CENTRAL_BROWSER_PORT:-7900}:10000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:10000/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
