kind = "web"
previewPath = "/"
title = "RedeASSO"
description = "Sistema de Gestão e Dimensionamento de Revestimentos Cerâmicos para a Casa dos Tubos."
version = "1.0.0"
id = "frontend-gestao-revestimento"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23022

[services.development]
run = "pnpm --filter @workspace/redeasso run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/redeasso", "run", "build" ]
serve = "static"
publicDir = "frontend-gestao-revestimento/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23022"
BASE_PATH = "/"
