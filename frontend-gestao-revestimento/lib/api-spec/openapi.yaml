openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification for RedeASSO - Sistema de Gestão e Dimensionamento de Revestimentos Cerâmicos
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Autenticação e sessão do RedeASSO
  - name: pisos
    description: Pisos e revestimentos cerâmicos
  - name: dashboard
    description: Dashboard e métricas
  - name: mapas
    description: Mapas de localização dos pisos no estoque

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/csrf:
    get:
      operationId: getCsrfToken
      tags: [auth]
      summary: Obter token CSRF
      description: Inicia ou reutiliza a sessão do RedeASSO e retorna os dados necessários para enviar o token CSRF nas operações de escrita.
      responses:
        "200":
          description: Token CSRF da sessão atual
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfTokenResponse"

  /auth/local/login:
    post:
      operationId: localLogin
      tags: [auth]
      summary: Entrar com credenciais locais
      description: Autentica o usuário local e vincula a identidade à sessão do RedeASSO. Requer o token retornado por `/auth/csrf` no cabeçalho indicado por `headerName`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocalLoginRequest"
      responses:
        "200":
          description: Login realizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
              example:
                authenticated: true
                username: usuario-local
                authType: LOCAL
                areaCentralConnected: false
        "400":
          description: Corpo da requisição inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Credenciais inválidas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Token CSRF ausente ou inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/area-central/attempts:
    post:
      operationId: startAreaCentralLoginAttempt
      tags: [auth]
      summary: Iniciar login assistido da Área Central
      description: >-
        Abre um navegador isolado no servidor e preenche as credenciais
        recebidas somente para esta tentativa. O CAPTCHA não é automatizado e
        deve ser confirmado pelo usuário no noVNC. A senha não é persistida,
        devolvida nem registrada em logs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartAreaCentralLoginRequest"
      responses:
        "201":
          description: Navegador pronto para interação humana
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaCentralLoginAttempt"
        "409":
          description: Já existe outra verificação em andamento
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Integração ou navegador assistido indisponível
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/area-central/attempts/complete:
    post:
      operationId: completeAreaCentralLoginAttempt
      tags: [auth]
      summary: Confirmar login assistido da Área Central
      description: >-
        Captura o cookie jar apenas no backend depois que o usuário concluiu
        a interação no navegador remoto. Requer token CSRF.
      responses:
        "200":
          description: Sessão RedeASSO autenticada ou vinculada à Área Central
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Não há tentativa de login nesta sessão
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Login ainda não concluído no navegador remoto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/area-central/attempts/current:
    get:
      operationId: getCurrentAreaCentralLoginAttempt
      tags: [auth]
      summary: Consultar o estado do login assistido atual
      description: >-
        Informa se o navegador remoto ainda aguarda a confirmação humana ou se
        o login externo já está pronto para concluir. Nunca devolve cookies,
        senha ou conteúdo da Área Central.
      responses:
        "200":
          description: Tentativa atual da sessão
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaCentralLoginAttempt"
        "404":
          description: Não há tentativa de login nesta sessão
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: cancelCurrentAreaCentralLoginAttempt
      tags: [auth]
      summary: Cancelar login assistido em andamento
      description: Fecha o navegador remoto associado à sessão atual. Requer token CSRF.
      responses:
        "204":
          description: Tentativa cancelada ou já encerrada

  /auth/session:
    get:
      operationId: getAuthSession
      tags: [auth]
      summary: Consultar a sessão atual
      description: >-
        Retorna sempre o estado da sessão. Uma sessão anônima é representada
        por `authenticated: false`, sem responder 401.
      responses:
        "200":
          description: Estado atual da sessão
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
              examples:
                authenticated:
                  summary: Sessão local autenticada
                  value:
                    authenticated: true
                    username: usuario-local
                    authType: LOCAL
                    areaCentralConnected: false
                anonymous:
                  summary: Sessão anônima
                  value:
                    authenticated: false
                    username: null
                    authType: null
                    areaCentralConnected: false

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Encerrar a sessão atual
      description: Invalida a sessão do RedeASSO e exige um token CSRF válido.
      responses:
        "204":
          description: Sessão encerrada
        "403":
          description: Token CSRF ausente ou inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /pisos:
    get:
      operationId: listPisos
      tags: [pisos]
      summary: Listar todos os pisos
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: Busca por nome, código rede ou código loja
        - name: localDeUso
          in: query
          schema:
            type: string
          description: Filtrar por local de uso
        - name: tipoPiso
          in: query
          schema:
            type: string
          description: Filtrar por tipo de piso
      responses:
        "200":
          description: Lista de pisos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Piso"

    post:
      operationId: createPiso
      tags: [pisos]
      summary: Cadastrar um novo piso
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PisoInput"
      responses:
        "201":
          description: Piso criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Piso"
        "400":
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /pisos/{id}:
    get:
      operationId: getPiso
      tags: [pisos]
      summary: Buscar piso por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Piso encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Piso"
        "404":
          description: Piso não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updatePiso
      tags: [pisos]
      summary: Atualizar piso
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PisoInput"
      responses:
        "200":
          description: Piso atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Piso"
        "404":
          description: Piso não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: deletePiso
      tags: [pisos]
      summary: Excluir piso
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Piso excluído
        "404":
          description: Piso não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Piso vinculado a uma posição do mapa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /pisos/codigo/{codigo}:
    get:
      operationId: getPisoByCodigo
      tags: [pisos]
      summary: Buscar piso pelo código (loja ou rede)
      parameters:
        - name: codigo
          in: path
          required: true
          schema:
            type: string
          description: Código Loja ou Código Rede
      responses:
        "200":
          description: Piso encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Piso"
        "404":
          description: Piso não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /pisos/calcular:
    post:
      operationId: calcularPiso
      tags: [pisos]
      summary: Calcular quantidade de caixas necessárias
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalculoInput"
      responses:
        "200":
          description: Resultado do cálculo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalculoResult"
        "400":
          description: Código, metragem ou margem inválida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Piso não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Métricas do dashboard
      responses:
        "200":
          description: Estatísticas gerais
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /dashboard/atividade-recente:
    get:
      operationId: getAtividadeRecente
      tags: [dashboard]
      summary: Atividades recentes do sistema
      responses:
        "200":
          description: Lista de atividades recentes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Atividade"

  /dashboard/pisos-por-tipo:
    get:
      operationId: getPisosPorTipo
      tags: [dashboard]
      summary: Contagem de pisos agrupados por tipo
      responses:
        "200":
          description: Pisos agrupados por tipo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GrupoTipo"

  /mapas:
    get:
      operationId: listMapas
      tags: [mapas]
      summary: Listar mapas completos
      responses:
        "200":
          description: Mapas e respectivas posições
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Mapa"
    post:
      operationId: createMapa
      tags: [mapas]
      summary: Criar mapa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MapaCreateRequest"
      responses:
        "201":
          description: Mapa criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mapa"
        "400":
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /mapas/{id}:
    parameters:
      - $ref: "#/components/parameters/MapaId"
    get:
      operationId: getMapa
      tags: [mapas]
      summary: Buscar mapa completo
      responses:
        "200":
          description: Mapa encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mapa"
        "404":
          description: Mapa não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      operationId: updateMapa
      tags: [mapas]
      summary: Atualizar nome ou rótulos do mapa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MapaUpdateRequest"
      responses:
        "200":
          description: Mapa completo atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mapa"
        "400":
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Mapa não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteMapa
      tags: [mapas]
      summary: Excluir mapa e suas posições
      responses:
        "204":
          description: Mapa excluído
        "404":
          description: Mapa não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /mapas/{id}/celulas/{pos}:
    parameters:
      - $ref: "#/components/parameters/MapaId"
      - name: pos
        in: path
        required: true
        schema:
          type: string
          pattern: "^[A-Z]([1-9]|[1-4][0-9]|50)$"
        description: Posição do mapa, por exemplo A1 ou C12
    put:
      operationId: updateMapaCell
      tags: [mapas]
      summary: Salvar de um a quatro pisos em uma posição
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MapaCellUpdateRequest"
      responses:
        "200":
          description: Mapa completo atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mapa"
        "400":
          description: Posição, piso ou quantidade inválida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Mapa não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: clearMapaCell
      tags: [mapas]
      summary: Limpar uma posição
      responses:
        "200":
          description: Mapa completo atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mapa"
        "400":
          description: Posição inválida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Mapa não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

components:
  parameters:
    MapaId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    LocalLoginRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
          writeOnly: true

    AreaCentralLoginAttempt:
      type: object
      additionalProperties: false
      required: [status, interactiveUrl, expiresAt]
      properties:
        status:
          type: string
          enum: [WAITING_FOR_HUMAN, READY_TO_COMPLETE]
        interactiveUrl:
          type: string
          format: uri
          description: URL privada do noVNC; nunca inclui a senha do VNC nem cookies externos.
        expiresAt:
          type: string
          format: date-time

    StartAreaCentralLoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 160
          description: Identificador da conta usada na Área Central durante esta tentativa.
        password:
          type: string
          minLength: 1
          maxLength: 512
          writeOnly: true
          description: Usada somente para preencher o navegador isolado; nunca é persistida ou devolvida.

    SessionResponse:
      type: object
      additionalProperties: false
      required:
        - authenticated
        - areaCentralConnected
      properties:
        authenticated:
          type: boolean
        username:
          type: ["string", "null"]
        authType:
          type: ["string", "null"]
          enum: [LOCAL, AREA_CENTRAL, null]
          description: Forma usada para autenticar a identidade atual no RedeASSO.
        areaCentralConnected:
          type: boolean
          description: Indica se a sessão atual possui uma sessão externa válida da Área Central vinculada.

    CsrfTokenResponse:
      type: object
      additionalProperties: false
      required:
        - headerName
        - parameterName
        - token
      properties:
        headerName:
          type: string
        parameterName:
          type: string
        token:
          type: string

    ApiError:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - status
        - timestamp
        - path
      properties:
        code:
          type: string
          description: Código estável e legível por máquina, como `INVALID_CREDENTIALS` ou `VALIDATION_ERROR`.
        message:
          type: string
        status:
          type: integer
          format: int32
          minimum: 400
          maximum: 599
        timestamp:
          type: string
          format: date-time
        path:
          type: string

    Piso:
      type: object
      required:
        - id
        - nome
        - codigoLoja
        - m2PorCaixa
        - createdAt
      properties:
        id:
          type: number
        nome:
          type: string
        codigoRede:
          type: ["string", "null"]
        codigoLoja:
          type: string
        largura:
          type: ["number", "null"]
          description: Largura em cm
        altura:
          type: ["number", "null"]
          description: Altura em cm
        rejunte:
          type: ["number", "null"]
          description: Rejunte em mm
        pecasPorCaixa:
          type: ["number", "null"]
        m2PorCaixa:
          type: number
          description: Metros quadrados por caixa
        localDeUso:
          type: ["string", "null"]
          description: Interno, Externo ou Ambos
        tipoPiso:
          type: ["string", "null"]
          description: Porcelanato, Cerâmica, etc.
        pei:
          type: ["number", "null"]
          description: Classe PEI (1-5)
        retificado:
          type: ["boolean", "null"]
        linkSite:
          type: ["string", "null"]
        linkFoto:
          type: ["string", "null"]
        valor:
          type: ["number", "null"]
          description: Preço de venda em reais por metro quadrado (R$/m²)
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: ["string", "null"]
          format: date-time

    PisoInput:
      type: object
      required:
        - nome
        - codigoLoja
        - m2PorCaixa
      properties:
        nome:
          type: string
        codigoRede:
          type: string
        codigoLoja:
          type: string
        largura:
          type: number
        altura:
          type: number
        rejunte:
          type: number
        pecasPorCaixa:
          type: number
        m2PorCaixa:
          type: number
        localDeUso:
          type: string
        tipoPiso:
          type: string
        pei:
          type: number
        retificado:
          type: boolean
        linkSite:
          type: string
        linkFoto:
          type: string
        valor:
          type: number

    CalculoInput:
      type: object
      required:
        - codigoPiso
        - metragemM2
      properties:
        codigoPiso:
          type: string
          description: Código Loja ou Código Rede do piso
        metragemM2:
          type: number
          description: Área total do cliente em metros quadrados
        margemQuebra:
          type: number
          description: Margem de quebra em percentual (ex 10 = 10%). Padrão 10.
          default: 10

    CalculoResult:
      type: object
      required:
        - piso
        - metragemM2
        - margemQuebra
        - metragemComMargem
        - quantidadeCaixas
        - valorTotal
      properties:
        piso:
          $ref: "#/components/schemas/Piso"
        metragemM2:
          type: number
        margemQuebra:
          type: number
        metragemComMargem:
          type: number
        quantidadeCaixas:
          type: integer
          format: int64
          description: Quantidade de caixas inteiras arredondada para cima
        valorTotal:
          type: ["number", "null"]
          description: M² efetivamente vendidos (caixas x m²/caixa) multiplicados pelo preço em R$/m²

    DashboardStats:
      type: object
      required:
        - totalPisos
        - calculosRealizados
        - totalImpressoes
        - estoqueDisponivel
      properties:
        totalPisos:
          type: number
        calculosRealizados:
          type: number
        totalImpressoes:
          type: number
        estoqueDisponivel:
          type: number

    Atividade:
      type: object
      required:
        - id
        - tipo
        - descricao
        - createdAt
      properties:
        id:
          type: number
        tipo:
          type: string
          description: cadastro, calculo, impressao
        descricao:
          type: string
        pisoNome:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    GrupoTipo:
      type: object
      required:
        - tipo
        - total
      properties:
        tipo:
          type: string
        total:
          type: number

    MapaLabels:
      type: object
      additionalProperties: false
      required: [top, bottom, left, right]
      properties:
        top:
          type: string
        bottom:
          type: string
        left:
          type: string
        right:
          type: string

    MapaLabelsInput:
      type: object
      additionalProperties: false
      properties:
        top:
          type: string
          maxLength: 160
        bottom:
          type: string
          maxLength: 160
        left:
          type: string
          maxLength: 160
        right:
          type: string
          maxLength: 160

    MapaCelula:
      type: object
      additionalProperties: false
      required: [pisoId, m2, caixas]
      properties:
        pisoId:
          type: integer
          format: int64
          minimum: 1
        m2:
          type: number
          minimum: 0
        caixas:
          type: integer
          minimum: 0

    Mapa:
      type: object
      additionalProperties: false
      required: [id, nome, linhas, colunas, labels, celulas, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        nome:
