name: Validate Docker fallback

on:
  push:
    branches-ignore:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: docker-fallback-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-fallback-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the local fallback image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: redeasso:fallback-check
          cache-from: type=gha
          cache-to: type=gha,mode=max
