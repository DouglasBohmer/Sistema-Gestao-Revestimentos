name: Validate and publish Docker images

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: douglasbohmer/sistema-gestao-revestimentos

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=redeasso-api
          cache-to: type=gha,mode=max,scope=redeasso-api

      - name: Build and publish assisted browser image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./infra/area-central-browser/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:area-central-browser-main
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:area-central-browser-sha-${{ github.sha }}
          cache-from: type=gha,scope=redeasso-area-central-browser
          cache-to: type=gha,mode=max,scope=redeasso-area-central-browser
