name: Verify application

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate frontend and Cloudflare Worker assets
        run: |
          pnpm run typecheck
          pnpm --filter @workspace/redeasso run build
          pnpm --filter @workspace/redeasso exec wrangler deploy --config wrangler.jsonc --dry-run

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Test Spring API
        working-directory: backend-gestao-revestimento
        run: ./mvnw -B -ntp test
