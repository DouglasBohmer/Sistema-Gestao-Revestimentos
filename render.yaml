services:
  - type: web
    name: redeasso-api
    runtime: docker
    region: ohio
    plan: free
    branch: main
    dockerfilePath: ./backend-gestao-revestimento/Dockerfile.render
    dockerContext: .
    # Sonda de processo sem o indicador Actuator de DataSource: não mantém o
    # PostgreSQL Neon acordado apenas por verificações de disponibilidade.
    healthCheckPath: /api/healthz
    # Em main, o Render aguarda a validação do GitHub Actions e então publica.
    autoDeployTrigger: checksPass
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SESSION_COOKIE_SAME_SITE
        value: lax
      - key: SESSION_TIMEOUT
        value: 12h
      - key: SESSION_COOKIE_MAX_AGE
        value: 12h
      # Chave estável AES-256, em Base64. Não trocar a cada deploy: a troca
      # invalida as sessões externas existentes. Nunca expor no frontend.
      - key: AREA_CENTRAL_SESSION_ENCRYPTION_KEY
        generateValue: true
      # Limpa sessões expiradas uma vez ao dia (06:00 UTC / 03:00 Brasília),
      # em vez do padrão do Spring Session de uma consulta por minuto.
      - key: SESSION_CLEANUP_CRON
        value: "0 0 6 * * *"
      - key: DATABASE_MAX_POOL_SIZE
        value: "5"
      # Cole a URL JDBC direta do Neon (não a URL de pooler) na criação do
      # Blueprint. Ex.: jdbc:postgresql://ep-...neon.tech/neondb?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      # O login local continua apenas enquanto a Área Central é homologada,
      # mas sem qualquer valor padrão exposto no repositório.
      - key: REDEASSO_LOCAL_ADMIN_ENABLED
        value: "true"
      - key: REDEASSO_LOCAL_ADMIN_USERNAME
        sync: false
      - key: REDEASSO_LOCAL_ADMIN_PASSWORD
        sync: false
      # Um único serviço: o gateway público encaminha a API para Spring em
      # loopback; Chromium só é iniciado durante uma tentativa de login.
      - key: REDEASSO_INTEGRATION_AREA_CENTRAL_ENABLED
        value: "true"
      - key: AREA_CENTRAL_INTERACTIVE_URL
        value: https://redeasso-api.onrender.com/vnc.html
      - key: AREA_CENTRAL_ALLOWED_FRAME_ORIGIN
        value: https://redeasso.assocom.workers.dev
      - key: AREA_CENTRAL_READ_TIMEOUT
        value: 90s
