services:
  - type: web
    name: redeasso-api
    runtime: docker
    region: ohio
    plan: free
    branch: main
    dockerfilePath: ./backend-gestao-revestimento/Dockerfile.render
    dockerContext: ./backend-gestao-revestimento
    healthCheckPath: /actuator/health
    # Em main, o Render aguarda a validação do GitHub Actions e então publica.
    autoDeployTrigger: checksPass
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SESSION_COOKIE_SAME_SITE
        value: lax
      - key: SESSION_TIMEOUT
        value: 12h
      - key: DATABASE_MAX_POOL_SIZE
        value: "5"
      # Cole a URL JDBC direta do Neon (não a URL de pooler) na criação do
      # Blueprint. Ex.: jdbc:postgresql://ep-...neon.tech/neondb?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      # O login local continua apenas enquanto a Área Central é homologada,
      # mas sem qualquer valor padrão exposto no repositório.
      - key: REDEASSO_LOCAL_ADMIN_ENABLED
        value: "true"
      - key: REDEASSO_LOCAL_ADMIN_USERNAME
        sync: false
      - key: REDEASSO_LOCAL_ADMIN_PASSWORD
        sync: false
      # Só ative depois de preencher a URL e os dois segredos do serviço
      # redeasso-area-central-browser criado neste mesmo Blueprint.
      - key: REDEASSO_INTEGRATION_AREA_CENTRAL_ENABLED
        value: "false"
      - key: AREA_CENTRAL_WEBDRIVER_URL
        sync: false
      - key: AREA_CENTRAL_INTERACTIVE_URL
        sync: false
      - key: AREA_CENTRAL_BROWSER_SERVICE_KEY
        sync: false
      - key: AREA_CENTRAL_INTERACTIVE_TOKEN_SECRET
        sync: false
      - key: AREA_CENTRAL_READ_TIMEOUT
        value: 90s

  # Chrome + Selenium + noVNC em serviço separado. Somente o gateway HTTPS
  # escuta a porta pública; os endpoints internos exigem chave e o websocket
  # do noVNC exige token curto emitido pelo Spring.
  - type: web
    name: redeasso-area-central-browser
    runtime: docker
    region: ohio
    plan: free
    branch: main
    dockerfilePath: ./infra/area-central-browser/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    envVars:
      - key: BROWSER_SERVICE_KEY
        sync: false
      - key: INTERACTIVE_TOKEN_SECRET
        sync: false
      - key: ALLOWED_FRAME_ORIGIN
        sync: false
