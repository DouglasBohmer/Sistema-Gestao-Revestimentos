services:
  - type: web
    name: redeasso-api
    runtime: docker
    region: ohio
    plan: free
    branch: main
    dockerfilePath: ./backend-gestao-revestimento/Dockerfile.render
    dockerContext: ./backend-gestao-revestimento
    healthCheckPath: /actuator/health
    # Em main, o Render aguarda a validação do GitHub Actions e então publica.
    autoDeployTrigger: checksPass
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SESSION_COOKIE_SAME_SITE
        value: lax
      - key: SESSION_TIMEOUT
        value: 12h
      - key: DATABASE_MAX_POOL_SIZE
        value: "5"
      # Cole a URL JDBC direta do Neon (não a URL de pooler) na criação do
      # Blueprint. Ex.: jdbc:postgresql://ep-...neon.tech/neondb?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      # O login local continua apenas enquanto a Área Central é homologada,
      # mas sem qualquer valor padrão exposto no repositório.
      - key: REDEASSO_LOCAL_ADMIN_ENABLED
        value: "true"
      - key: REDEASSO_LOCAL_ADMIN_USERNAME
        sync: false
      - key: REDEASSO_LOCAL_ADMIN_PASSWORD
        sync: false
      # O navegador assistido roda no servidor Docker da loja e e alcancado
      # pela URL HTTPS publica do Tailscale Funnel. Estes valores sao
      # operacionais e ficam somente no painel Render.
      - key: REDEASSO_INTEGRATION_AREA_CENTRAL_ENABLED
        sync: false
      - key: AREA_CENTRAL_WEBDRIVER_URL
        sync: false
      - key: AREA_CENTRAL_INTERACTIVE_URL
        sync: false
      - key: AREA_CENTRAL_BROWSER_SERVICE_KEY
        sync: false
      - key: AREA_CENTRAL_INTERACTIVE_TOKEN_SECRET
        sync: false
      - key: AREA_CENTRAL_READ_TIMEOUT
        value: 90s
