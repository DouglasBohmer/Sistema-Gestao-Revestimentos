name: redeasso-backend-dev

services:
  postgres:
    image: postgres:17-alpine
    container_name: redeasso-postgres-dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-redeasso}
      POSTGRES_USER: ${POSTGRES_USER:-redeasso}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-redeasso}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - redeasso-postgres-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  redeasso-postgres-dev:
