spring:
  application:
    name: redeasso-backend
  profiles:
    default: local
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/redeasso}
    username: ${DATABASE_USERNAME:redeasso}
    password: ${DATABASE_PASSWORD:redeasso}
    hikari:
      maximum-pool-size: ${DATABASE_MAX_POOL_SIZE:5}
      minimum-idle: ${DATABASE_MIN_IDLE:0}
      connection-timeout: ${DATABASE_CONNECTION_TIMEOUT:30000}
  flyway:
    enabled: true
    clean-disabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  session:
    store-type: jdbc
    timeout: ${SESSION_TIMEOUT:12h}
    jdbc:
      initialize-schema: never

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        name: REDEASSO_SESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

redeasso:
  auth:
    local:
      enabled: false
  integration:
    area-central:
      enabled: false
      base-url: ${AREA_CENTRAL_BASE_URL:https://redeasso.areacentral.com.br}
      login-url: ${AREA_CENTRAL_LOGIN_URL:https://redeasso.areacentral.com.br/401/?pg=associado_catalogos_produtos&ordenacao=nome-asc}
      web-driver-url: ${AREA_CENTRAL_WEBDRIVER_URL:http://area-central-browser:4444}
      interactive-url: ${AREA_CENTRAL_INTERACTIVE_URL:}
      browser-service-key: ${AREA_CENTRAL_BROWSER_SERVICE_KEY:}
      interactive-token-secret: ${AREA_CENTRAL_INTERACTIVE_TOKEN_SECRET:}
      connect-timeout: ${AREA_CENTRAL_CONNECT_TIMEOUT:5s}
      read-timeout: ${AREA_CENTRAL_READ_TIMEOUT:10s}
      login-attempt-timeout: ${AREA_CENTRAL_LOGIN_ATTEMPT_TIMEOUT:10m}
