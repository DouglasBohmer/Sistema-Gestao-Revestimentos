spring:
  application:
    name: redeasso-backend
  profiles:
    default: local
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/redeasso}
    username: ${DATABASE_USERNAME:redeasso}
    password: ${DATABASE_PASSWORD:redeasso}
  flyway:
    enabled: true
    clean-disabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  session:
    store-type: jdbc
    timeout: ${SESSION_TIMEOUT:12h}
    jdbc:
      initialize-schema: never

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        name: REDEASSO_SESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

redeasso:
  auth:
    local:
      enabled: false
  integration:
    area-central:
      enabled: false
      base-url: ${AREA_CENTRAL_BASE_URL:https://redeasso.areacentral.com.br}
      connect-timeout: ${AREA_CENTRAL_CONNECT_TIMEOUT:5s}
      read-timeout: ${AREA_CENTRAL_READ_TIMEOUT:10s}
